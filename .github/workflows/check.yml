name: GTA VI Tracker

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

concurrency:
  group: gta-vi-tracker-update
  cancel-in-progress: true

jobs:
  tracker:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # NODE SETUP (OPTIMIZED)
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # =========================
      # RUN SCRAPER
      # =========================
      - name: Run scraper
        run: node scraper.js
        continue-on-error: false

      - name: Validate generated files
        run: |
          node --check scraper.js
          node --check script.js
          node -e "JSON.parse(require('fs').readFileSync('data.json', 'utf8'))"

      # =========================
      # COMMIT CHANGES ONLY IF NEEDED
      # =========================
      - name: Commit updates
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data.json

          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "Auto-update GTA VI tracker"

          git push
